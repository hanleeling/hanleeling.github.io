{% include base_path %}

<li style="margin-bottom: 0.9em;">
  <strong>{{ post.date | date: "%Y" }}</strong> —
  {% if post.link %}
    <a href="{{ post.link }}">“{{ post.title }}”</a>
  {% else %}
    <a href="{{ base_path }}{{ post.url }}">“{{ post.title }}”</a>
  {% endif %}
  <br>
  <em>{{ post.venue }}</em>{% if post.location %}, {{ post.location }}{% endif %}.
  {% if post.type %} {{ post.type }}.{% endif %}
</li>
